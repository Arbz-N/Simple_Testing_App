<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello. — Staging</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #030308; width: 100vw; height: 100vh; overflow: hidden; cursor: none; }
canvas { position: fixed; inset: 0; z-index: 0; }

.staging-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: 8px 0; text-align: center;
  font-family: 'Cormorant Garamond', serif; font-size: 11px;
  letter-spacing: 4px; text-transform: uppercase;
  color: rgba(251,191,36,0.9);
  background: rgba(251,191,36,0.07);
  border-bottom: 1px solid rgba(251,191,36,0.2);
  animation: barPulse 3s ease-in-out infinite;
}
@keyframes barPulse { 0%,100%{opacity:.7} 50%{opacity:1} }

.scene {
  position: fixed; inset: 0; z-index: 2;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 28px; pointer-events: none;
}

.hello-wrap { position: relative; display: inline-block; }

.hello {
  font-family: 'Cormorant Garamond', serif; font-weight: 700;
  font-size: clamp(80px, 13vw, 190px);
  letter-spacing: -4px; line-height: 1;
  user-select: none;
  background: linear-gradient(160deg, #ffffff 0%, #fef3c7 15%, #fbbf24 32%, #ffffff 50%, #f59e0b 65%, #d97706 80%, #fde68a 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 35px rgba(251,191,36,0.9)) drop-shadow(0 0 70px rgba(245,158,11,0.6)) drop-shadow(0 0 120px rgba(217,119,6,0.3));
  animation: bloom 4s ease-in-out infinite;
  transition: transform 0.15s;
}
@keyframes bloom {
  0%,100% { filter: drop-shadow(0 0 30px rgba(251,191,36,0.8)) drop-shadow(0 0 65px rgba(245,158,11,0.55)) drop-shadow(0 0 110px rgba(217,119,6,0.25)); }
  50%      { filter: drop-shadow(0 0 55px rgba(253,230,138,1)) drop-shadow(0 0 110px rgba(251,191,36,0.8)) drop-shadow(0 0 180px rgba(245,158,11,0.5)); }
}

.hello-ref {
  position: absolute; top: 100%; left: 0;
  font-family: 'Cormorant Garamond', serif; font-weight: 700;
  font-size: clamp(80px, 13vw, 190px); letter-spacing: -4px; line-height: 1;
  background: linear-gradient(160deg, rgba(251,191,36,0.4) 0%, rgba(245,158,11,0.15) 40%, transparent 70%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  transform: scaleY(-1) translateY(2px);
  mask-image: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, transparent 60%);
  -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, transparent 60%);
  user-select: none;
}

.subtitle {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: clamp(13px, 1.6vw, 18px); letter-spacing: 3px;
  color: rgba(251,191,36,0.45); text-align: center;
  animation: fadeInUp 1.5s ease forwards; opacity: 0; transform: translateY(10px);
}
@keyframes fadeInUp { to { opacity:1; transform:translateY(0); } }

body::after {
  content: ''; position: fixed; inset: 10px;
  border: 1px dashed rgba(251,191,36,0.1);
  pointer-events: none; z-index: 5; border-radius: 2px;
}

#cur { position:fixed; width:8px; height:8px; background:#fbbf24; border-radius:50%; pointer-events:none; z-index:999; transform:translate(-50%,-50%); box-shadow:0 0 12px #fbbf24, 0 0 24px #d97706; }
#cur-ring { position:fixed; width:36px; height:36px; border:1px solid rgba(251,191,36,0.5); border-radius:50%; pointer-events:none; z-index:998; transform:translate(-50%,-50%); }

.mark { position:fixed; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:11px; letter-spacing:3px; color:rgba(251,191,36,0.3); z-index:10; line-height:2; }
.tl{top:48px;left:32px} .tr{top:48px;right:32px;text-align:right} .bl{bottom:30px;left:32px} .br{bottom:30px;right:32px;text-align:right}

.lh{position:fixed;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(251,191,36,0.15),transparent);z-index:3}
.lh.t{top:80px} .lh.b{bottom:60px}
.lv{position:fixed;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(251,191,36,0.15),transparent);z-index:3}
.lv.l{left:60px} .lv.r{right:60px}
</style>
</head>
<body>

<div class="staging-bar">⚠ &nbsp; Staging Environment — Test Branch &nbsp; ⚠</div>
<canvas id="c"></canvas>
<div class="lh t"></div><div class="lh b"></div>
<div class="lv l"></div><div class="lv r"></div>
<span class="mark tl">Staging<br>Test Branch</span>
<span class="mark tr">Azure<br>App Service</span>
<span class="mark bl">Testing in Progress</span>
<span class="mark br">2025</span>

<div class="scene">
  <div class="hello-wrap">
    <div class="hello" id="hello">Hello, I am testing the Azure App.</div>
    <div class="hello-ref">Hello, I am testing the Azure App.</div>
  </div>
  <div class="subtitle">— staging slot · not live yet —</div>
</div>

<div id="cur"></div>
<div id="cur-ring"></div>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H, t = 0;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight;}
resize(); addEventListener('resize',resize);

const orbs=[
  {x:.5,y:.5,r:.5,hue:40,speed:.00012,phase:0},
  {x:.3,y:.4,r:.32,hue:35,speed:.00018,phase:1.8},
  {x:.7,y:.6,r:.28,hue:45,speed:.00015,phase:3.2},
  {x:.2,y:.7,r:.22,hue:30,speed:.0002,phase:0.9},
  {x:.8,y:.3,r:.26,hue:50,speed:.00014,phase:4.1},
];

const stars=Array.from({length:180},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.2,a:Math.random(),speed:0.005+Math.random()*0.015,phase:Math.random()*Math.PI*2}));

function drawFrame(){
  ctx.fillStyle='#030308'; ctx.fillRect(0,0,W,H);
  for(const o of orbs){
    const px=(Math.sin(t*o.speed+o.phase)*0.22+o.x)*W;
    const py=(Math.cos(t*o.speed*.7+o.phase+1)*0.22+o.y)*H;
    const rad=o.r*Math.min(W,H)*(0.88+0.12*Math.sin(t*0.0008+o.phase));
    const g=ctx.createRadialGradient(px,py,0,px,py,rad);
    g.addColorStop(0,`hsla(${o.hue},90%,65%,0.13)`);
    g.addColorStop(0.3,`hsla(${o.hue},80%,55%,0.08)`);
    g.addColorStop(1,`hsla(${o.hue},70%,35%,0)`);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }
  const bl=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,W*.38);
  bl.addColorStop(0,'rgba(251,191,36,0.15)');
  bl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bl; ctx.fillRect(0,0,W,H);
  for(const s of stars){
    const a=s.a*(0.4+0.6*Math.abs(Math.sin(t*s.speed+s.phase)));
    ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,240,200,${a})`; ctx.fill();
  }
  t++; requestAnimationFrame(drawFrame);
}
drawFrame();

const cur=document.getElementById('cur'), ring=document.getElementById('cur-ring');
let mx=W/2,my=H/2,rx=W/2,ry=H/2;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px';});
(function loopRing(){rx+=(mx-rx)*0.1;ry+=(my-ry)*0.1;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loopRing);})();

const helloEl=document.getElementById('hello');
document.addEventListener('mousemove',e=>{
  const dx=(e.clientX/W-0.5)*14, dy=(e.clientY/H-0.5)*6;
  helloEl.style.transform=`skewX(${dx*0.03}deg) translateX(${dx*0.3}px) translateY(${dy*0.2}px)`;
});
</script>
</body>
</html>
