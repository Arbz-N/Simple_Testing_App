<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello.</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #030308;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  cursor: none;
}

canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
}

.scene {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.hello-wrap {
  position: relative;
  display: inline-block;
}

/* Main text */
.hello {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 700;
  font-size: clamp(120px, 19vw, 260px);
  letter-spacing: -5px;
  line-height: 1;
  position: relative;
  user-select: none;

  /* Glossy chrome-like gradient */
  background: linear-gradient(
    160deg,
    #ffffff 0%,
    #e8e0ff 18%,
    #a78bfa 35%,
    #ffffff 50%,
    #c4b5fd 65%,
    #7c3aed 80%,
    #ddd6fe 100%
  );
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;

  /* Bloom glow */
  filter: drop-shadow(0 0 40px rgba(139,92,246,0.9))
          drop-shadow(0 0 80px rgba(109,40,217,0.6))
          drop-shadow(0 0 120px rgba(139,92,246,0.3));

  animation: bloom 4s ease-in-out infinite, gradShift 8s ease-in-out infinite;
  transition: filter 0.2s, transform 0.15s;
}

@keyframes bloom {
  0%, 100% {
    filter: drop-shadow(0 0 30px rgba(139,92,246,0.8))
            drop-shadow(0 0 70px rgba(109,40,217,0.55))
            drop-shadow(0 0 120px rgba(139,92,246,0.25));
  }
  50% {
    filter: drop-shadow(0 0 55px rgba(167,139,250,1))
            drop-shadow(0 0 110px rgba(139,92,246,0.8))
            drop-shadow(0 0 180px rgba(109,40,217,0.5))
            drop-shadow(0 0 240px rgba(139,92,246,0.2));
  }
}

@keyframes gradShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

/* Reflection */
.hello-ref {
  position: absolute;
  top: 100%;
  left: 0;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 700;
  font-size: clamp(120px, 19vw, 260px);
  letter-spacing: -5px;
  line-height: 1;
  background: linear-gradient(
    160deg,
    rgba(139,92,246,0.4) 0%,
    rgba(167,139,250,0.15) 40%,
    transparent 70%
  );
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  transform: scaleY(-1) translateY(2px);
  mask-image: linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, transparent 60%);
  -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, transparent 60%);
  pointer-events: none;
  user-select: none;
}

/* Cursor */
#cur {
  position: fixed;
  width: 8px; height: 8px;
  background: #a78bfa;
  border-radius: 50%;
  pointer-events: none;
  z-index: 999;
  transform: translate(-50%,-50%);
  box-shadow: 0 0 12px #a78bfa, 0 0 24px #7c3aed;
}
#cur-ring {
  position: fixed;
  width: 36px; height: 36px;
  border: 1px solid rgba(167,139,250,0.5);
  border-radius: 50%;
  pointer-events: none;
  z-index: 998;
  transform: translate(-50%,-50%);
  box-shadow: 0 0 10px rgba(139,92,246,0.3);
}

/* Corner marks */
.mark {
  position: fixed;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 11px;
  letter-spacing: 3px;
  color: rgba(167,139,250,0.35);
  z-index: 10;
  line-height: 2;
}
.tl { top: 30px; left: 32px; }
.tr { top: 30px; right: 32px; text-align: right; }
.bl { bottom: 30px; left: 32px; }
.br { bottom: 30px; right: 32px; text-align: right; }

/* Thin lines */
.lh { position: fixed; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(139,92,246,0.2), transparent); z-index: 3; }
.lh.t { top: 60px; }
.lh.b { bottom: 60px; }
.lv { position: fixed; top: 0; bottom: 0; width: 1px; background: linear-gradient(180deg, transparent, rgba(139,92,246,0.2), transparent); z-index: 3; }
.lv.l { left: 60px; }
.lv.r { right: 60px; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="lh t"></div>
<div class="lh b"></div>
<div class="lv l"></div>
<div class="lv r"></div>

<span class="mark tl">Production<br>Master Branch</span>
<span class="mark tr">Azure<br>App Service</span>
<span class="mark bl">v1.0 · Live</span>
<span class="mark br">2025</span>

<div class="scene">
  <div class="hello-wrap">
    <div class="hello" id="hello">Hello.</div>
    <div class="hello-ref">Hello.</div>
  </div>
</div>

<div id="cur"></div>
<div id="cur-ring"></div>

<script>
// ── Canvas: deep space + blooming light orbs ─────────────────────────────
const c = document.getElementById('c');
const cx = c.getContext('2d');
let W, H, t = 0;

function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
resize();
addEventListener('resize', resize);

// Orbs — the "blooming" light sources
const orbs = [
  { x:.5,  y:.5,  r:.55, hue:270, speed:.00012, phase:0    },
  { x:.3,  y:.4,  r:.35, hue:250, speed:.00018, phase:1.8  },
  { x:.7,  y:.6,  r:.3,  hue:290, speed:.00015, phase:3.2  },
  { x:.2,  y:.7,  r:.25, hue:220, speed:.0002,  phase:0.9  },
  { x:.8,  y:.3,  r:.28, hue:310, speed:.00014, phase:4.1  },
  { x:.5,  y:.8,  r:.2,  hue:260, speed:.00022, phase:2.5  },
];

// Stars
const stars = Array.from({length:180}, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.2,
  a: Math.random(),
  speed: 0.005 + Math.random() * 0.015,
  phase: Math.random() * Math.PI * 2
}));

function drawFrame() {
  // Deep dark base
  cx.fillStyle = '#030308';
  cx.fillRect(0, 0, W, H);

  // Orbs — bloom effect
  for (const o of orbs) {
    const px = (Math.sin(t * o.speed + o.phase) * 0.22 + o.x) * W;
    const py = (Math.cos(t * o.speed * .7 + o.phase + 1) * 0.22 + o.y) * H;
    const pulse = 0.88 + 0.12 * Math.sin(t * 0.0008 + o.phase);
    const rad = o.r * Math.min(W, H) * pulse;

    const g = cx.createRadialGradient(px, py, 0, px, py, rad);
    g.addColorStop(0,   `hsla(${o.hue},90%,75%,0.13)`);
    g.addColorStop(0.3, `hsla(${o.hue},80%,60%,0.08)`);
    g.addColorStop(0.7, `hsla(${o.hue},70%,45%,0.04)`);
    g.addColorStop(1,   `hsla(${o.hue},70%,40%,0)`);
    cx.fillStyle = g;
    cx.fillRect(0, 0, W, H);
  }

  // Central bright bloom behind text
  const bloom = cx.createRadialGradient(W*.5, H*.5, 0, W*.5, H*.5, W*.38);
  bloom.addColorStop(0,   'rgba(139,92,246,0.18)');
  bloom.addColorStop(0.4, 'rgba(109,40,217,0.08)');
  bloom.addColorStop(1,   'rgba(0,0,0,0)');
  cx.fillStyle = bloom;
  cx.fillRect(0, 0, W, H);

  // Stars
  for (const s of stars) {
    const a = s.a * (0.4 + 0.6 * Math.abs(Math.sin(t * s.speed + s.phase)));
    cx.beginPath();
    cx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    cx.fillStyle = `rgba(220,210,255,${a})`;
    cx.fill();
  }

  t++;
  requestAnimationFrame(drawFrame);
}
drawFrame();

// ── Mouse / cursor ────────────────────────────────────────────────────────
const cur = document.getElementById('cur');
const ring = document.getElementById('cur-ring');
let mx = W/2, my = H/2, rx = W/2, ry = H/2;

document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cur.style.left = mx + 'px'; cur.style.top = my + 'px';
});

(function loopRing() {
  rx += (mx - rx) * 0.1;
  ry += (my - ry) * 0.1;
  ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
  requestAnimationFrame(loopRing);
})();

// ── Hello reacts to mouse ─────────────────────────────────────────────────
const helloEl = document.getElementById('hello');
document.addEventListener('mousemove', e => {
  const dx = (e.clientX / W - 0.5) * 14;
  const dy = (e.clientY / H - 0.5) * 6;
  helloEl.style.transform = `skewX(${dx * 0.03}deg) translateX(${dx * 0.3}px) translateY(${dy * 0.2}px)`;
});
</script>
</body>
</html>
